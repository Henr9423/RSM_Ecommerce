services:

    frontend:
        build:
            context: ./frontend/react/ecommerce-project
            dockerfile: Dockerfile
        
        container_name: rsm_frontend
        restart: unless-stopped

        ports:
         - "${FRONTEND_PORT}:80"
            
        depends_on:
           - backend
            
    
    backend:
        build:
            context: ./backend/rsm_backend
            dockerfile: Dockerfile

        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_HTTP_PORTS: 8080
            ConnectionStrings__DefaultConnection: >-
                Host=${DB_HOST};
                Port=${DB_PORT};
                Database=${DB_NAME};
                Username=${DB_USER};
                Password=${DB_PASSWORD}
            Resend__ApiKey: ${RESEND_API_KEY}
            GuestJwt__Secret: ${GUEST_JWT_SECRET}
            GuestJwt__Issuer: ${GUEST_JWT_ISSUER}
            GuestJwt__Audience: ${GUEST_JWT_AUDIENCE}
            GuestJwt__ExpirationMinutes: ${GUEST_JWT_EXPIRATIONMINUTES}
            Frontend__Origin: ${FRONTEND_ORIGIN}

        ports:
            - "${BACKEND_PORT}:8080"

        depends_on:
            db:
                condition: service_healthy

    
    db:
        image: postgres:17-bookworm
        container_name: rsm_postgres_db
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
                ]
            interval: 30s
            timeout: 10s
            retries: 5
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}

        ports:
            - "${POSTGRES_PORT}:5432"

        volumes:
            - pgdata:/var/lib/postgresql/data

    adminer:
        image: adminer
        restart: unless-stopped
        container_name: postgres-adminer-rsm
        depends_on:
           db: 
            condition: service_healthy     
        ports:
            - "${ADMINER_PORT}:8080"
        environment:
            - ADMINER_DEFAULT_SERVER=db    

    pgadmin:
        image: dpage/pgadmin4
        container_name: postgres-pgadmin-rsm
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        ports:
         - "${PGADMIN_PORT}:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
            
        volumes:
            - pgadmin_data:/var/lib/pgadmin

volumes:
    pgdata:
    pgadmin_data: